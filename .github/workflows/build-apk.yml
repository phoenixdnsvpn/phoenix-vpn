name: Build Phoenix VPN Android APK (Multi-Arch)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Go setup and Gomobile steps have been completely removed

      - name: Verify Native jniLibs and AAR
        run: |
          echo "Checking native libraries..."
          ls -la android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          ls -la android/app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          echo "Checking for local AAR file in libs directory..."
          ls -la android/app/libs/ || echo "No libs directory found. Ensure your AAR is committed!"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.jks

      # ==========================================
      # 1. BUILD ARM64-V8A (64-BIT) VERSION
      # ==========================================
      - name: Build ARM64 Version
        run: |
          cd android
          # Note: Removed -PtargetAar since Gradle will now grab the committed AAR from the libs folder automatically
          ./gradlew clean assembleRelease \
            -Pandroid.injected.abi=arm64-v8a \
            -Pandroid.injected.signing.store.file=$(pwd)/../release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          
          mkdir -p ../release-artifacts
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/release/app-release.apk ../release-artifacts/PhoenixVpn-${TAG_NAME}-arm64-v8a.apk

      # ==========================================
      # 2. BUILD ARMEABI-V7A (32-BIT) VERSION
      # ==========================================
      - name: Build ARMv7 Version
        run: |
          cd android
          ./gradlew clean assembleRelease \
            -Pandroid.injected.abi=armeabi-v7a \
            -Pandroid.injected.signing.store.file=$(pwd)/../release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/release/app-release.apk ../release-artifacts/PhoenixVpn-${TAG_NAME}-armeabi-v7a.apk

      # ==========================================
      # 3. PUBLISH RELEASE TO GITHUB
      # ==========================================
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/PhoenixVpn-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
